# Releases each new version automatically. Runs when package.json changes on main (a version bump
# merged), or manually (Actions > Release > Run workflow). For the version in package.json it:
#   1. creates the GitHub release v<version> (and its tag) with the prebuilt tarballs;
#   2. publishes to npm via Trusted Publishing (OIDC): the ES module build as <version> (dist-tag
#      latest) and the CommonJS build in dist-cjs/ as <version>-cjs (dist-tag cjs, for Jest).
#      NPM_TOKEN is only needed if the package itself is ever new on npm.
# Each step is skipped when already done, so re-runs and unrelated package.json edits are no-ops.
# See docs/development.md, "Publishing".
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write # create the release and its tag
  id-token: write # lets npm verify this workflow via OIDC

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
      - name: What is already released
        id: state
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          gh release view "v$version" >/dev/null 2>&1 && echo "github=done" >> "$GITHUB_OUTPUT"
          # Both builds: <version> (ES modules) and <version>-cjs (CommonJS).
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] &&
             [ -n "$(npm view "$name@$version-cjs" version 2>/dev/null)" ]; then
            echo "npm=done" >> "$GITHUB_OUTPUT"
          fi
          true
      - if: steps.state.outputs.github != 'done' || steps.state.outputs.npm != 'done'
        run: npm ci && npm run check
      - name: GitHub release with tarballs
        if: steps.state.outputs.github != 'done'
        env:
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          npm pack
          npm pack ./dist-cjs
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes mil-symbol-converter-*.tgz
      - name: Publish to npm
        if: steps.state.outputs.npm != 'done'
        env:
          # Empty when the secret is not set; npm then uses Trusted Publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The ES module build from the repository root (tag latest), the CommonJS build from
          # dist-cjs/ (version <version>-cjs, tag cjs).
          for build in ".:latest" "dist-cjs:cjs"; do
            dir=${build%%:*} tag=${build##*:}
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm."
            elif [ -z "$(npm view "$name" name 2>/dev/null)" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
              # A trusted publisher can only be added to a package that exists: the first publish needs a token.
              echo "::warning::$name is not on npm yet and there is no NPM_TOKEN secret: skipped (see docs/development.md, Publishing)."
            else
              npm publish "./$dir" --access public --tag "$tag"
            fi
          done
