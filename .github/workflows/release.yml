# Publishes to npm when a GitHub release is published.
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is stored in the repository.
# One-time setup on npmjs.com is required; see "Publishing" in README.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this workflow via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
