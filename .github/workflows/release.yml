# Releases each new version automatically. Runs when package.json changes on main (a version bump
# merged), or manually (Actions > Release > Run workflow). For the version in package.json it:
#   1. creates the GitHub release v<version> (and its tag) with the prebuilt tarball, so
#        npm install https://github.com/Lansenou/Mil-Symbol-Converter/releases/download/v<version>/mil-symbol-converter-<version>.tgz
#      works without npm;
#   2. publishes to npm, via Trusted Publishing (OIDC) once it is set up on npmjs.com, or via the
#      NPM_TOKEN secret for the very first publish. Before either exists, this step is skipped.
# Each step is skipped when already done, so re-runs and unrelated package.json edits are no-ops.
# See docs/development.md, "Publishing".
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write # create the release and its tag
  id-token: write # lets npm verify this workflow via OIDC

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
      - name: What is already released
        id: state
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          gh release view "v$version" >/dev/null 2>&1 && echo "github=done" >> "$GITHUB_OUTPUT"
          [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] && echo "npm=done" >> "$GITHUB_OUTPUT"
          [ -n "$(npm view "$name" name 2>/dev/null)" ] && echo "npm_exists=yes" >> "$GITHUB_OUTPUT"
          true
      - if: steps.state.outputs.github != 'done' || steps.state.outputs.npm != 'done'
        run: npm ci && npm run check
      - name: GitHub release with tarball
        if: steps.state.outputs.github != 'done'
        env:
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          npm pack
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes mil-symbol-converter-*.tgz
      - name: Publish to npm
        if: steps.state.outputs.npm != 'done'
        env:
          # Empty when the secret is not set; npm then uses Trusted Publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_EXISTS: ${{ steps.state.outputs.npm_exists }}
        run: |
          # The first publish needs a token: a trusted publisher can only be added to an existing package.
          if [ "$NPM_EXISTS" != yes ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::Not on npm yet and no NPM_TOKEN secret: skipped (see docs/development.md, Publishing)."
            exit 0
          fi
          npm publish --access public
