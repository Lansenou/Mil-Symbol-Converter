# Publishes to npm when a GitHub release is published.
# Authenticates with npm Trusted Publishing (OIDC) once it is set up on npmjs.com. Until then
# (the very first publish), it uses the NPM_TOKEN repository secret if one exists.
# See docs/development.md, "Publishing".
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this workflow via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
        env:
          # Empty when the secret is not set; npm then uses Trusted Publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
